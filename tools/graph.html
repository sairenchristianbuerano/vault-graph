<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vault Graph</title>
<meta name="vault-token" content="__VAULT_TOKEN__">
<style>
  :root { --bg:#0b1512; --hi:79,192,141; --text:#d9e6e0; --muted:#7d918a; --panel:#08100ee6; --line:#1d2b27; --tint:#050a08d9; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px ui-monospace, Consolas, monospace; overflow:hidden; }
  canvas { display:block; cursor:grab; touch-action:none; }
  #bar { position:fixed; top:0; left:0; right:0; padding:6px 12px; background:var(--panel); display:flex; gap:6px 16px; flex-wrap:wrap; align-items:center; border-bottom:1px solid var(--line); font-size:12px; z-index:3; }
  #bar .t { color:rgb(var(--hi)); font-weight:bold; }
  #stamp { color:var(--muted); }
  #flash { color:var(--bg); background:rgb(var(--hi)); padding:1px 8px; border-radius:10px; display:none; }
  #stale { color:#e0a050; display:none; }
  #running { color:rgb(180,140,255); }
  #running:not(:empty)::before { content:'●'; margin-right:6px; animation:blink 1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  #legend { position:fixed; left:12px; top:var(--top,44px); background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font-size:11px; line-height:1.7; z-index:2; }
  #legend i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:-1px; box-shadow:0 0 6px currentColor; }
  /* selected node: details live inside the tinted space */
  #info { position:fixed; right:0; top:var(--top,44px); bottom:0; width:min(380px, 42vw); background:var(--tint); border-left:1px solid var(--line); padding:16px 18px; overflow:auto; display:none; z-index:2; line-height:1.55; backdrop-filter:blur(2px); }
  #info h2 { margin:0 0 4px; font-size:15px; word-break:break-all; }
  #info .path { color:var(--muted); font-size:11px; word-break:break-all; margin-bottom:10px; }
  #info .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px; color:#0b1512; margin-bottom:10px; }
  #info .desc { margin:6px 0 12px; }
  #info .sec { color:var(--muted); margin:12px 0 4px; font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
  #info button.nb { display:block; width:100%; text-align:left; background:none; border:0; border-left:2px solid var(--line); color:var(--text); font:inherit; padding:3px 8px; cursor:pointer; word-break:break-all; }
  #info button.nb:hover { border-left-color:rgb(var(--hi)); color:rgb(var(--hi)); }
  #info button.nb.task { word-break:normal; overflow-wrap:anywhere; margin-top:4px; }
  #info .prog { margin:2px 0 8px 10px; }
  #zmain.on { border-color:rgb(255,110,170); box-shadow:0 0 10px rgba(255,110,170,.7); }
  #info textarea.runin { display:block; width:100%; box-sizing:border-box; margin-top:8px; background:#0e1c18; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:6px 8px; font:inherit; resize:vertical; }
  #info button.run { margin-top:6px; width:100%; padding:6px 10px; border-radius:5px; border:1px solid rgb(180,140,255); background:rgb(180,140,255); color:#0b1512; font:inherit; font-weight:bold; cursor:pointer; }
  #info button.run:hover { filter:brightness(1.12); }
  #info .runmsg { color:var(--muted); font-size:.85em; margin-top:6px; min-height:1.2em; }
  #info code { display:block; background:#0e1c18; border:1px solid var(--line); padding:6px 8px; border-radius:4px; word-break:break-all; user-select:all; }
  #info .x { position:absolute; top:10px; right:12px; background:none; border:0; color:var(--muted); font-size:18px; cursor:pointer; }
  @media (max-width:640px) { #info { width:auto; left:0; top:auto; height:48vh; border-left:0; border-top:1px solid var(--line); } #legend { display:none; } }
  #log { position:fixed; right:12px; bottom:12px; width:min(480px, calc(100vw - 24px)); max-height:36vh; display:flex; flex-direction:column; background:var(--tint); border:1px solid var(--line); border-radius:6px; z-index:2; font-size:11px; }
  body.sel #log { right:calc(min(380px, 42vw) + 12px); width:min(420px, calc(58vw - 36px)); }
  #log header { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:6px 10px; border-bottom:1px solid var(--line); cursor:pointer; user-select:none; }
  #log header b { color:var(--text); }
  #log .chip { padding:0 7px; border-radius:9px; border:1px solid var(--line); white-space:nowrap; }
  /* chip colour = the actor's star colour (set inline); the state only changes the style */
  #log .chip.working { animation:blink 1.2s ease-in-out infinite; box-shadow:0 0 6px currentColor; }
  #log .chip.quiet { border-style:dashed; }
  #log .chip.done { opacity:.85; }
  #log .chip.idle { opacity:.55; }
  #log .body { overflow:auto; padding:4px 10px 8px; line-height:1.55; }
  #log.min .body { display:none; }
  #log .row { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #log .ts { color:var(--muted); margin-right:6px; }
  #log .who { margin-right:6px; }
  #log .what { color:var(--text); margin-right:6px; }
  #log .det { color:var(--muted); }
  @media (max-width:640px) { #log { max-height:30vh; } body.sel #log { display:none; } }
  #board { position:fixed; left:12px; top:calc(var(--top,44px) + var(--legendH,0px) + 10px); bottom:58px; width:min(300px, 34vw); overflow:auto; background:var(--tint); border:1px solid var(--line); border-radius:6px; z-index:2; font-size:11px; line-height:1.5; }
  #board header { position:sticky; top:0; background:#08100e; padding:6px 10px; border-bottom:1px solid var(--line); cursor:pointer; user-select:none; display:flex; justify-content:space-between; }
  #board.min > :not(header) { display:none; }
  #board.min { bottom:auto; }
  #board details { border-bottom:1px solid var(--line); }
  #board header { flex-wrap:wrap; }
  #bq { order:3; width:100%; margin-top:6px; background:#0b1512; color:inherit; border:1px solid var(--line); border-radius:4px; padding:3px 7px; font:inherit; font-weight:normal; cursor:text; }
  #bq:focus { outline:1px solid rgba(var(--hi),.7); }
  #board.min #bq { display:none; }
  #board summary { padding:5px 10px; cursor:pointer; font-weight:bold; list-style:none; display:flex; justify-content:space-between; }
  #board summary::-webkit-details-marker { display:none; }
  #board summary .n { color:var(--muted); font-weight:normal; }
  #board ul { margin:0; padding:0 10px 8px 22px; }
  #board li { margin:2px 0; word-break:break-word; }
  #board li.changed { animation:glowin 2.5s ease-out; }
  /* priority: [85%] colours the item, @you makes it pulse */
  #board ul { list-style:none; }
  #board li.task { --rgb:120,170,230; border-left:3px solid rgb(var(--rgb)); padding:3px 6px 3px 8px; border-radius:0 4px 4px 0; background:rgba(var(--rgb),.05); }
  #board li.task .txt { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  #board .sev { display:inline-block; font-size:.78em; font-weight:bold; letter-spacing:.03em; padding:0 6px; margin:0 6px 2px 0; border-radius:3px; color:rgb(var(--rgb)); background:rgba(var(--rgb),.16); border:1px solid rgba(var(--rgb),.55); }
  #board .youtag { color:#0b1512; background:rgb(var(--rgb)); border-color:rgb(var(--rgb)); }
  #board li.you { animation:youglow 2.4s ease-in-out infinite; }
  #board li.done { opacity:.6; }
  #board .rec, #tm .rec { color:rgb(var(--hi)); background:rgba(var(--hi),.14); border-color:rgba(var(--hi),.7); }
  #board .sess, #tm .sess { color:rgb(180,140,255); background:rgba(180,140,255,.12); border-color:rgba(180,140,255,.5); font-weight:normal; }
  #tm .sline { color:var(--muted); font-size:.85em; margin:0 0 12px; }
  #board li.isrec { outline:1px dashed rgba(var(--hi),.45); outline-offset:-1px; }
  .prog { display:flex; align-items:center; gap:8px; margin:5px 0 1px; }
  .prog .pl { font-size:.78em; color:rgb(var(--hi)); white-space:nowrap; min-width:5.2em; }
  .prog .pb { flex:1; height:5px; border-radius:3px; background:rgba(255,255,255,.08); overflow:hidden; }
  .prog .pb i { display:block; height:100%; border-radius:3px; background:linear-gradient(90deg, rgba(var(--hi),.55), rgb(var(--hi))); box-shadow:0 0 6px rgba(var(--hi),.6); transition:width .6s ease; }
  #tm .prog { margin:0 0 14px; }
  #board .needyou { color:rgb(255,110,170); font-weight:bold; animation:youtext 2.4s ease-in-out infinite; margin-right:8px; }
  @keyframes youglow { 0%,100% { box-shadow:0 0 0 rgba(var(--rgb),0); background:rgba(var(--rgb),.05); }
                       50% { box-shadow:0 0 14px rgba(var(--rgb),.6); background:rgba(var(--rgb),.16); } }
  @keyframes youtext { 0%,100% { opacity:.55; } 50% { opacity:1; text-shadow:0 0 8px rgba(255,110,170,.8); } }
  @media (prefers-reduced-motion:reduce) { #board li.you { animation:none; box-shadow:0 0 10px rgba(var(--rgb),.5); } #board .needyou { animation:none; } }
  #usage { margin-left:auto; color:var(--muted); white-space:nowrap; cursor:help; }
  #usage .u { position:relative; color:var(--text); padding:0 2px 2px; }
  #usage .u i { position:absolute; left:0; bottom:0; height:2px; background:rgb(var(--hi)); border-radius:1px; }
  #usage .u.warm { color:rgb(230,200,80); } #usage .u.warm i { background:rgb(230,200,80); }
  #usage .u.hot { color:rgb(255,90,90); } #usage .u.hot i { background:rgb(255,90,90); box-shadow:0 0 6px rgba(255,90,90,.8); }
  /* task modal */
  #tm { position:fixed; inset:0; background:rgba(2,6,5,.72); backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; z-index:9; padding:16px; }
  #tm.on { display:flex; }
  #tm .box { --rgb:125,145,138; width:min(560px,100%); max-height:85vh; overflow:auto; background:#08100e; border:1px solid rgba(var(--rgb),.6); border-top:3px solid rgb(var(--rgb)); border-radius:8px; padding:18px 20px; box-shadow:0 0 40px rgba(var(--rgb),.25); font-size:var(--fs,14px); line-height:1.6; }
  #tm .meta { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; align-items:center; }
  #tm .sec { color:var(--muted); font-size:.85em; text-transform:uppercase; letter-spacing:.06em; }
  #tm .body { white-space:pre-wrap; word-break:break-word; margin:0 0 14px; }
  #tm .body a { color:rgb(var(--hi)); }
  #tm .acts { display:flex; gap:8px; flex-wrap:wrap; }
  #tm button { font:inherit; font-size:.9em; padding:6px 12px; border-radius:5px; border:1px solid var(--line); background:#0e1c18; color:var(--text); cursor:pointer; }
  #tm button:hover { border-color:rgb(var(--hi)); }
  #tm button.go { background:rgb(var(--rgb)); color:#0b1512; border-color:rgb(var(--rgb)); font-weight:bold; }
  #tm textarea { width:100%; box-sizing:border-box; margin:4px 0 12px; background:#050a08; color:var(--text); border:1px solid var(--line); border-radius:5px; padding:8px 10px; font:inherit; font-size:.92em; resize:vertical; }
  #tm textarea:focus { outline:none; border-color:rgb(var(--rgb)); box-shadow:0 0 0 2px rgba(var(--rgb),.25); }
  #tm .msg { color:var(--muted); font-size:.85em; margin-top:10px; min-height:1.2em; }
  #tm .sev, #tm .youtag { display:inline-block; font-size:.78em; font-weight:bold; padding:0 6px; border-radius:3px; color:rgb(var(--rgb)); background:rgba(var(--rgb),.16); border:1px solid rgba(var(--rgb),.55); }
  #tm .youtag { color:#0b1512; background:rgb(var(--rgb)); }
  /* scrollbars in the vault theme */
  * { scrollbar-width:thin; scrollbar-color:#2a4a40 transparent; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:#1f3a32; border-radius:8px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover { background:rgb(var(--hi)); background-clip:padding-box; }
  ::-webkit-scrollbar-corner { background:transparent; }
  @keyframes glowin { from { background:rgba(var(--hi),.35); } to { background:transparent; } }
  @media (max-width:640px) { #board { width:auto; right:12px; bottom:auto; max-height:40vh; } }
  #ctl { position:fixed; bottom:12px; left:12px; display:flex; gap:6px; z-index:1; }
  #ctl button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; min-width:34px; height:34px; font:inherit; cursor:pointer; }
  #ctl button:hover { border-color:rgb(var(--hi)); color:rgb(var(--hi)); }

  /* ---- layout v2: bigger type, left column (legend + tasks), bottom activity, right details ---- */
  *, *::before, *::after { box-sizing:border-box; }
  :root { --fs:15px; --fs-s:13.5px; --side:380px; --panelW:420px; --logH:30vh; --gap:12px; }
  html, body { font-size:var(--fs); line-height:1.5; }
  #bar { font-size:var(--fs); padding:8px 16px; gap:6px 20px; }
  #legend { left:var(--gap); top:calc(var(--top,44px) + var(--gap)); width:calc(var(--side) - 2 * var(--gap));
            display:grid; grid-template-columns:max-content max-content; justify-content:space-between; gap:2px 14px; padding:10px 14px; font-size:var(--fs-s); line-height:1.6; }
  #legend > div { white-space:nowrap; }
  #legend i { width:10px; height:10px; }
  #board { left:var(--gap); top:calc(var(--top,44px) + var(--legendH,0px) + 2 * var(--gap)); bottom:var(--gap);
           width:calc(var(--side) - 2 * var(--gap)); font-size:var(--fs-s); line-height:1.5; }
  #board header { padding:8px 14px; font-size:var(--fs); }
  #board summary { padding:7px 14px; font-size:var(--fs); }
  #board ul { padding:0 14px 10px 30px; }
  #board li { margin:4px 0; }
  #log { left:var(--side); right:var(--gap); bottom:var(--gap); width:auto; height:var(--logH); max-height:none; font-size:var(--fs-s); }
  #log.min { height:auto; }
  body.sel #log { right:calc(var(--panelW) + var(--gap)); width:auto; }
  #log header { padding:8px 14px; gap:12px; font-size:var(--fs-s); }
  #log header b { font-size:var(--fs); }
  #log .chip { padding:1px 10px; border-radius:11px; }
  #log .body { padding:6px 14px 10px; line-height:1.65; }
  #info { width:var(--panelW); font-size:var(--fs); padding:20px 22px; }
  #info h2 { font-size:19px; margin-bottom:8px; }
  #info .path, #info .sec { font-size:var(--fs-s); }
  #info .badge { font-size:var(--fs-s); padding:2px 10px; }
  #info button.nb { padding:5px 10px; font-size:var(--fs); }
  #ctl { top:calc(var(--top,44px) + var(--gap)); bottom:auto; left:auto; right:var(--gap); flex-direction:column; z-index:2; }
  body.sel #ctl { right:calc(var(--panelW) + var(--gap)); }
  #ctl button { min-width:40px; height:40px; font-size:16px; }
  #help { display:none; }
  @media (max-width:900px) {
    :root { --side:0px; --panelW:100vw; --logH:26vh; --fs:14px; --fs-s:13px; }
    #legend { display:none; }
    #board { left:var(--gap); right:var(--gap); width:auto; top:calc(var(--top,44px) + var(--gap)); bottom:auto; max-height:34vh; }
    #log { left:var(--gap); }
    #info { left:0; right:0; width:auto; top:auto; height:50vh; border-left:0; border-top:1px solid var(--line); }
    body.sel #log, body.sel #board { display:none; }
    body.sel #ctl { right:var(--gap); }
  }
  #legend > div { border-radius:4px; padding:0 4px; }
  #legend > div:hover { background:#13221d; }
  #legend > div.on { background:#1b2e27; outline:1px solid currentColor; }
  /* launcher app pages (?view=graph | ?view=tasks): one job per page */
  body.v-graph #board, body.v-graph #legend { display:none !important; }
  body.v-tasks #c, body.v-tasks #legend, body.v-tasks #log, body.v-tasks #ctl, body.v-tasks #info { display:none !important; }
  body.v-tasks #board { display:block !important; left:var(--gap); right:var(--gap); top:calc(var(--top,44px) + var(--gap)); bottom:var(--gap); width:auto; max-height:none; }
</style>
</head>
<body>
<div id="bar">
  <span class="t">Vault graph</span>
  <span id="reason"></span>
  <span id="stamp"></span>
  <span id="flash">updated</span>
  <span id="usage" title=""></span>
  <span id="stale">server stopped: run python tools/vault.py ui</span>
  <span id="running"></span>
</div>
<div id="legend"></div>
<canvas id="c"></canvas>
<div id="info"></div>
<div id="tm" role="dialog" aria-modal="true" aria-labelledby="tmsec"><div class="box"><div class="meta"><span id="tmsec" class="sec"></span><span id="tmtags"></span></div><p id="tmbody" class="body"></p><div id="tmnotebox" hidden><label for="tmnote" class="sec">Your prompt or note</label><textarea id="tmnote" rows="3" maxlength="2000" placeholder="e.g. done: merged the fix on Friday. Or: use the shorter draft."></textarea></div><div class="acts"><button id="tmgo" class="go">▶ Do it in Claude</button><button id="tmtype" aria-expanded="false">✎ Type prompt</button><button id="tmdone">✓ Mark done</button><button id="tmcheck" title="A new Claude session checks live evidence (PRs, issues, mail, tickets, dates) for this task only, then moves it to Done or updates its status">🔍 Check if it's done</button><button id="tmcopy">Copy prompt</button><button id="tmnode">Show in graph</button><button id="tmx">Close</button></div><div id="tmmsg" class="msg" aria-live="polite"></div></div></div>
<div id="board"><header id="boardh" title="Click to collapse or expand"><b>Tasks</b><span id="boardn" class="ts"></span><input id="bq" type="search" placeholder="Search tasks: words, ABC-123, need you, high" aria-label="Search tasks"></header><div id="boardb"></div></div>
<div id="log"><header id="logh" title="Click to collapse or expand"><b>Activity</b><span id="chips"></span><span id="ago" class="ts"></span></header><div class="body" id="logb"></div></div>
<div id="ctl">
  <button id="zin" title="Zoom in (+)">+</button>
  <button id="zout" title="Zoom out (-)">−</button>
  <button id="zfit" title="Fit whole graph (f)">fit</button>
  <button id="zhi" title="Zoom to highlight (h)">◎</button>
  <button id="zmain" title="Follow Claude (main): zoom to it and what it is working on, and keep the camera on it as it moves (m). Click again, drag the map, or pick another star to stop." style="color:rgb(255,110,170)">●</button>
</div>
<script>
const VIEW = new URLSearchParams(location.search).get('view');  // the launcher app's pages: 'graph' or 'tasks'
if (VIEW) document.body.classList.add('v-' + VIEW);
const PHONE = !!window.AndroidBridge;  // inside the launcher app, which adds this bridge
const okLaunch = () => !PHONE || confirm('Start Claude on the laptop?');  // a phone in a pocket should not launch sessions by accident
window.showNode = id => { if (byId[id]) select(byId[id]); };  // the app calls this for "Show in graph" from the tasks page
const cv = document.getElementById('c'), cx = cv.getContext('2d');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const HI = '79,192,141', EDGE = '120,160,145', BG = '#0b1512';
// colour per node type (agents stand out)
// sides: each kind gets its own outline (diamond, triangle, hexagon), so you can tell them apart without
// relying on colour; notes stay round
const CAT = {
  agent:  { rgb: '180,140,255', name: 'agent', sides: 4 },
  subagent: { rgb: '70,225,215', name: 'subagent', sides: 4 },  // a running agent, started by Claude or by another agent: same shape, own colour
  skill:  { rgb: '240,184,90',  name: 'skill', sides: 3 },
  memory: { rgb: '111,183,232', name: 'memory' },
  work:   { rgb: '150,185,170', name: 'work' },
  entity: { rgb: '190,200,140', name: 'ticket · repo', sides: 6 },
  note:   { rgb: '130,150,142', name: 'other' },
  main:   { rgb: '255,110,170', name: 'Claude (main)' },
};
// the main session is its own star: biggest, unique colour, drifts toward what it is working on
const MAIN = { id: 'main', kind: 'main', cat: 'main', repo: '-', desc: 'This Claude session. It drifts toward the notes it is working on; the lines show what it touched last.',
               p: { x: 0, y: 0 }, d: { x: 0, y: 0 }, deg: 0, ph: 0, sp: 1 };
let mainTouched = [], workingOn = {};
let touchTs = {}, linkAnim = {};
let retract = null, lastIdleTs;  // lastIdleTs: newest main idle seen; undefined until the first poll, so a page load does not pan
function panToMain() {  // centre the main star at the current zoom; leaves the camera alone while a star's details are open
  if (pinned || !nodes.length) return;
  glideTo(MAIN.p.x, MAIN.p.y, view.k);
}  // {list, t0}: the main star's lines pulling back in after it went idle  // 'actor|note id' -> newest tool call seen on it; -> when its connect animation started
const catOf = n => n.kind === 'entity' ? 'entity' : /(^|\/)agents\//.test(n.id) ? 'agent' : /(^|\/)skills\//.test(n.id) ? 'skill'
  : n.id.includes('/memory/') ? 'memory' : n.id.includes('/work/') || n.id.includes('/runbooks/') ? 'work' : 'note';
let W = 0, H = 0, dpr = window.devicePixelRatio || 1;
let nodes = [], edges = [], byId = {}, pos = {}, hiN = new Set(), hiE = new Set();
// "new since last build" glows at full strength when it appears and fades to nothing over this
// long; the header shows how much glow is left
const HIGHLIGHT_HOURS = 1;
let hiUntil = 0, hiFade = 0, hiReason = '';
function expireHighlight() {
  const left = Math.max(0, Math.min(1, (hiUntil - Date.now()) / (HIGHLIGHT_HOURS * 36e5)));
  if (hiN.size && left > 0) { document.getElementById('reason').textContent = `${hiReason} · glow ${Math.round(left * 100)}%`; return; }
  if (hiN.size) { hiN = new Set(); hiE = new Set(); edges.forEach(e => e.hi = false); }
  document.getElementById('reason').textContent = hiReason ? `No new links in the last ${HIGHLIGHT_HOURS} h` : '';
}

    if (!show || (pinned && n !== hover) || ((n.cat === 'agent' || n.cat === 'skill') && active[label(n.id)])) continue;  // working ones have their own label
    const [x, y] = S(n.d);
    cx.fillText(label(n.id), x, y + (hiN.has(n.id) ? 24 : -10));
  }
  drawMain(t);
  if (catFocus && !pinned) drawCat(t);
  if (pinned) drawSelection(t);
  drawActive(t);
  drawFrame(t);
}

// glowing frame round the graph: steady when Claude is idle, rolling "mountain" waves when it works;
// colour = 5-hour plan usage (green < 70%, yellow 70-89%, red 90%+), same scale as the top bar
let planPct = null;
function drawFrame(t) {
  const { x0, y0, x1, y1 } = vr;
  if (x1 - x0 < 80 || y1 - y0 < 80) return;
  const rgb = planPct == null ? CAT.main?.rgb || '79,192,141' : planPct >= 90 ? '255,90,90' : planPct >= 70 ? '230,200,80' : '79,192,141';
  const m = lastLog.length ? lastLog.filter(e => e.who === 'main').pop() : null;
  const busy = !still && ((m && m.what !== 'idle' && (Date.now() / 1000 - m.ts) < BUSY_CAP) || Object.values(active).some(a => a.kind === 'agent'));
  // each edge is a light bar: white-hot core fading out at both ends, light spilling inward onto the graph.
  // working: the spill swells into smooth rolling "mountains" and the whole frame breathes
  const breathe = busy ? .5 + .5 * Math.sin(t * 1.8) : .5, H0 = busy ? 16 + 10 * breathe : 12;
  const edges = [[x0, y0, x1, y0, 0, 1], [x1, y0, x1, y1, -1, 0], [x1, y1, x0, y1, 0, -1], [x0, y1, x0, y0, 1, 0]];
  cx.save(); cx.globalCompositeOperation = 'lighter'; cx.lineCap = 'round';
  let s = 0;
  edges.forEach(([ax, ay, bx, by, nx, ny], i) => {
    const len = Math.hypot(bx - ax, by - ay), pts = [];
    for (let d = 0; d <= len; d += Math.min(8, len)) {
      const f = d / len, u = s + d, taper = Math.pow(Math.sin(Math.PI * f), .7);
      const w1 = .5 + .5 * Math.sin(u / 110 - t * 2.2), w2 = .5 + .5 * Math.sin(u / 47 + t * 1.3);
      pts.push([ax + (bx - ax) * f, ay + (by - ay) * f, H0 * taper * (busy ? .3 + .5 * w1 * w1 + .2 * w2 : 1)]);
    }
    s += len;
    const sp = cx.createLinearGradient(ax, ay, ax + nx * H0, ay + ny * H0);  // light spill, soft-edged with a blur
    sp.addColorStop(0, `rgba(${rgb},${.16 + .12 * breathe})`); sp.addColorStop(.35, `rgba(${rgb},${.06 + .05 * breathe})`); sp.addColorStop(1, `rgba(${rgb},0)`);
    cx.beginPath(); pts.forEach(([x, y], k) => k ? cx.lineTo(x, y) : cx.moveTo(x, y));
    for (let k = pts.length - 1; k >= 0; k--) cx.lineTo(pts[k][0] + nx * pts[k][2], pts[k][1] + ny * pts[k][2]);
    cx.closePath(); cx.filter = 'blur(4px)'; cx.fillStyle = sp; cx.fill(); cx.filter = 'none';
    const c = busy ? .5 + .25 * Math.sin(t * 1.1 + i * 1.6) : .5;  // working: the hot spot drifts along the bar
    const bar = a => {
      const g = cx.createLinearGradient(ax, ay, bx, by);
      g.addColorStop(0, `rgba(${a},0)`); g.addColorStop(Math.max(.08, c - .38), `rgba(${a},.25)`); g.addColorStop(c, `rgba(${a},1)`);
      g.addColorStop(Math.min(.92, c + .38), `rgba(${a},.25)`); g.addColorStop(1, `rgba(${a},0)`);
      return g;
    };
    cx.beginPath(); cx.moveTo(ax, ay); cx.lineTo(bx, by);
    cx.shadowColor = `rgba(${rgb},1)`; cx.shadowBlur = 10 + 8 * breathe;
    cx.globalAlpha = .45 + .3 * breathe; cx.strokeStyle = bar(rgb); cx.lineWidth = 2; cx.stroke();          // coloured glow
    cx.shadowBlur = 4; cx.globalAlpha = .85 + .15 * breathe; cx.strokeStyle = bar('255,255,255'); cx.lineWidth = 1.3; cx.stroke();  // white core
    cx.globalAlpha = 1; cx.shadowBlur = 0;
  });
  cx.restore();
}

// what a working actor draws (main and running agents alike): thin lines fading toward the stars it is
// touching, their names, and rings rolling outward while it works. A star outside the visible area gets
// a marker pinned to the frame edge instead of a line running off-screen; click the marker to fly there
let markers = [];
function drawWork(who, x, y, r, rgb, list, busy, pulse, t, shrink = 1) {
  const m = 14, inside = (px, py) => px > vr.x0 + m && px < vr.x1 - m && py > vr.y0 + m && py < vr.y1 - m;
  const text = (s, px, py) => { cx.lineWidth = 3; cx.strokeStyle = 'rgba(5,10,8,.85)'; cx.strokeText(s, px, py); cx.fillStyle = `rgb(${rgb})`; cx.fillText(s, px, py); };
  // where the way from (fx,fy) out to (tx,ty) crosses the frame edge
  const edge = (fx, fy, tx, ty) => {
    const dx = tx - fx, dy = ty - fy;
    const f = Math.min(dx > 0 ? (vr.x1 - m - fx) / dx : dx < 0 ? (vr.x0 + m - fx) / dx : 1, dy > 0 ? (vr.y1 - m - fy) / dy : dy < 0 ? (vr.y0 + m - fy) / dy : 1);
    return [fx + dx * f, fy + dy * f];
  };
  const pin = (px, py, a, s, n) => {  // arrow pointing off-screen + name, inside the frame
    const tip = (d, da) => [px + d * Math.cos(a + da), py + d * Math.sin(a + da)];
    cx.fillStyle = `rgb(${rgb})`; cx.beginPath(); cx.moveTo(...tip(8, 0)); cx.lineTo(...tip(6, 2.4)); cx.lineTo(...tip(6, -2.4)); cx.fill();
    const L = px <= vr.x0 + m + 1, R = px >= vr.x1 - m - 1, T = py <= vr.y0 + m + 1;
    cx.textAlign = R ? 'right' : L ? 'left' : 'center';
    const hw = cx.measureText(s + ' ›').width / 2;  // top/bottom labels: keep the whole name inside the frame
    text(s + ' ›', R ? px - 12 : L ? px + 12 : Math.min(Math.max(px, vr.x0 + m + hw), vr.x1 - m - hw), py + (L || R ? 4 : T ? 22 : -12));
    markers.push({ x: px, y: py, n });
  };
  cx.save(); cx.lineCap = 'round'; cx.font = '13px ui-monospace, Consolas, monospace';
  let ax = x, ay = y;  // lines start at the actor, or at its own edge marker when the actor is off-screen
  const away = !inside(x, y);
  if (away) { const cx0 = (vr.x0 + vr.x1) / 2, cy0 = (vr.y0 + vr.y1) / 2; [ax, ay] = edge(cx0, cy0, x, y); }
  const wk = who === MAIN ? 'main' : label(who.id);
  for (const n of list) {
    let [nx, ny] = S(n.d);
    const off = !inside(nx, ny);
    if (off && away) continue;  // both ends off-screen: nothing to show
    if (off) [nx, ny] = edge(x, y, nx, ny);
    // each new tool call on a note draws the line out to it with a bright head, then a ring where it lands
    const age = (performance.now() - (linkAnim[wk + '|' + n.id] ?? -1e9)) / 1000, grow = (still ? 1 : ease(Math.max(0, Math.min(1, age / .6)))) * shrink;
    const gx = ax + (nx - ax) * grow, gy = ay + (ny - ay) * grow;
    const g = cx.createLinearGradient(ax, ay, nx, ny);
    g.addColorStop(0, `rgba(${rgb},${.5 + .3 * pulse})`); g.addColorStop(1, `rgba(${rgb},${off ? .55 : .12})`);
    cx.strokeStyle = g; cx.lineWidth = 1.2;
    cx.beginPath(); cx.moveTo(ax, ay); cx.lineTo(gx, gy); cx.stroke();
    if (grow < 1) {
      cx.shadowColor = `rgba(${rgb},1)`; cx.shadowBlur = 12; cx.fillStyle = '#fff';
      cx.beginPath(); cx.arc(gx, gy, 3, 0, 6.3); cx.fill(); cx.shadowBlur = 0;
      continue;
    }
    if (!off && age < 1.4) {
      const f = (age - .6) / .8;
      cx.strokeStyle = `rgba(${rgb},${(1 - f) * .9})`; cx.lineWidth = 2;
      shapePath(n.cat, nx, ny, radius(n) + 4 + f * 26); cx.stroke();
    }
    if (off) { const [sx, sy] = S(n.d); pin(nx, ny, Math.atan2(sy - y, sx - x), label(n.id), n); }
    else { cx.textAlign = 'center'; text(label(n.id), nx, ny + radius(n) + 16); }
  }
  if (away && shrink === 1) pin(ax, ay, Math.atan2(y - ay, x - ax), who === MAIN ? 'Claude (main)' : label(who.id), who);
  cx.restore();
  if (busy && !still) for (let i = 0; i < 2; i++) {
    const f = (t * .7 + i / 2) % 1;
    cx.strokeStyle = `rgba(${rgb},${(1 - f) * .7})`; cx.lineWidth = 2;
    shapePath(who.cat, x, y, r + 6 + f * 46); cx.stroke();  // rings in the actor's own shape
  }
}

function drawMain(t) {
  if (!nodes.length) return;
  const [x, y] = S(MAIN.d), rgb = CAT.main.rgb, m = lastLog.length ? lastLog.filter(e => e.who === 'main').pop() : null;
  const busy = m && m.what !== 'idle' && (Date.now() / 1000 - m.ts) < BUSY_CAP;
  const pulse = still ? .6 : (Math.sin(t * (busy ? 4 : 1.5)) + 1) / 2;
  drawWork(MAIN, x, y, radius(MAIN), rgb, mainTouched, busy, pulse, t);
  if (retract) {  // idle: the old lines slowly pull back into the star, head first, then vanish (5 s: an exit, no rush)
    const u = (performance.now() - retract.t0) / 5000;
    if (u >= 1) retract = null; else drawWork(MAIN, x, y, radius(MAIN), rgb, retract.list, false, pulse, t, 1 - ease(u));
  }
  cx.save(); cx.shadowColor = `rgba(${rgb},1)`; cx.shadowBlur = 22 + 16 * pulse;
  star(MAIN, x, y, .7 + .3 * pulse, false); cx.restore();
  const fp = (performance.now() - focusAt) / 1400;  // the camera just landed on it: one soft focus ring
  if (fp >= 0 && fp < 1) {
    cx.strokeStyle = `rgba(${rgb},${(1 - fp) * .8})`; cx.lineWidth = 2;
    cx.beginPath(); cx.arc(x, y, radius(MAIN) + 8 + ease(fp) * 70, 0, 6.3); cx.stroke();
  }
  cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(x, y, radius(MAIN) * .35, 0, 6.3); cx.fill();
  cx.font = 'bold 15px ui-monospace, Consolas, monospace'; cx.textAlign = 'center'; cx.fillStyle = `rgb(${rgb})`;
  const bg = Object.values(active).filter(a => a.kind === 'agent').length;  // its turn ended, its background agents did not
  cx.fillText('Claude (main)' + (m ? (m.what === 'idle' ? (bg ? ` · waiting on ${bg} agent${bg > 1 ? 's' : ''}` : ' · idle') : busy ? ' · working' : ' · quiet') : ''), x, y - radius(MAIN) - 14);
}

// a running agent (or a skill in use) works like the main star: dashed lines to what it touches,
// a fast pulse and rings rolling outward
// where a running agent sits: its own star, or (built-in agents like Explore have none) a stand-in star
// orbiting whoever started it, so nested agents hang off their parent
function agentAt(name, depth = 0) {
  const n = nodes.find(n => (n.cat === 'agent' || n.cat === 'skill') && label(n.id) === name);
  if (n) return { n, xy: S(n.d) };
  const par = active[name]?.parent, [px, py] = par && par !== 'main' && active[par] && depth < 4 ? agentAt(par, depth + 1).xy : S(MAIN.d);
  let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) | 0;
  const ang = (Math.abs(h) % 360) * Math.PI / 180;
  return { n: { id: name, cat: 'agent', deg: 4 }, xy: [px + 95 * Math.cos(ang), py + 95 * Math.sin(ang)] };
}
function drawActive(t) {
  for (const [name, a] of Object.entries(active)) {
    if (a.kind === 'skill' && !nodes.some(n => n.cat === 'skill' && label(n.id) === name)) continue;  // plugin skills: no star
    const sub = a.kind === 'agent', at = agentAt(name), [x, y] = at.xy;  // anything the Agent tool started is a subagent
    const n = sub ? { ...at.n, cat: 'subagent' } : at.n, rgb = CAT[n.cat].rgb, r = radius(n);
    const pulse = still ? .6 : (Math.sin(t * 4) + 1) / 2;
    if (a.kind === 'agent') {  // dashed line from whoever started it, dashes flowing toward the agent
      const [px, py] = a.parent && a.parent !== 'main' && active[a.parent] ? agentAt(a.parent).xy : S(MAIN.d);
      cx.save(); cx.setLineDash([5, 7]); cx.lineDashOffset = still ? 0 : -t * 24;
      cx.strokeStyle = `rgba(${rgb},.6)`; cx.lineWidth = 1.5; cx.shadowColor = `rgba(${rgb},1)`; cx.shadowBlur = 6;
      cx.beginPath(); cx.moveTo(px, py); cx.lineTo(x, y); cx.stroke(); cx.restore();
    }
    drawWork(n, x, y, r, rgb, workingOn[name] || [], true, pulse, t);
    cx.save(); cx.shadowColor = `rgba(${rgb},1)`; cx.shadowBlur = 22 + 16 * pulse;
    star(n, x, y, .7 + .3 * pulse, true); cx.restore();
    cx.fillStyle = '#fff'; shapePath(n.cat, x, y, r * .35); cx.fill();
    cx.font = 'bold 14px ui-monospace, Consolas, monospace'; cx.textAlign = 'center'; cx.fillStyle = `rgb(${rgb})`;
    cx.fillText(name + (a.kind === 'agent' ? ' · working' : ' · in use'), x, y - r - 30);
    const sub2 = sub && a.parent ? `spawned by ${a.parent === 'main' ? 'Claude (main)' : a.parent}` + (a.desc ? ' · ' : '') : '';  // who started it
    if (sub2 || (a.desc && a.kind === 'agent')) { cx.font = '13px ui-monospace, Consolas, monospace'; cx.fillStyle = '#c9d8d1'; cx.fillText(sub2 + (a.desc || ''), x, y - r - 14); }
  }
}

// dark tint over everything, then the selected star, its lines and neighbours on top
function drawSelection(t) {
  cx.fillStyle = 'rgba(4,9,7,.78)'; cx.fillRect(0, 0, W, H);
  const nb = neighbours(pinned), [px, py] = S(pinned.d), rgb = CAT[pinned.cat].rgb;
  const pulse = still ? .6 : (Math.sin(t * 2.4) + 1) / 2;
  cx.save(); cx.lineCap = 'round';
  for (const [m] of nb) {
    const [x, y] = S(m.d);
    cx.shadowColor = `rgba(${rgb},1)`; cx.shadowBlur = 8 + 8 * pulse;
    cx.strokeStyle = `rgba(${rgb},${.45 + .35 * pulse})`; cx.lineWidth = 1.6;
    cx.beginPath(); cx.moveTo(px, py); cx.lineTo(x, y); cx.stroke();
  }
  cx.restore();
  cx.font = '13px ui-monospace, Consolas, monospace'; cx.textAlign = 'center';
  for (const [m] of nb) {
    const [x, y] = S(m.d);
    star(m, x, y, 1, true);
    cx.fillStyle = '#c9d8d1'; cx.fillText(label(m.id), x, y - 12);
  }
  // selection ring
  const r = radius(pinned) * 1.8 + 6 + 3 * pulse;
  star(pinned, px, py, 1, true);
  cx.save(); cx.shadowColor = `rgba(${rgb},1)`; cx.shadowBlur = 18;
  cx.strokeStyle = `rgba(${rgb},.95)`; cx.lineWidth = 2;
  shapePath(pinned.cat, px, py, r); cx.stroke(); cx.restore();
  cx.font = 'bold 15px ui-monospace, Consolas, monospace'; cx.fillStyle = '#ffffff';
  cx.fillText(label(pinned.id), px, py + r + 16);
}

let raf = null;
function loop(ms) { tick(ms); draw(ms / 1000); raf = still ? null : requestAnimationFrame(loop); }
function frame() { if (VIEW === 'tasks') return; if (still || raf === null) { tick(performance.now()); draw(performance.now() / 1000); } }

const runDraft = {};
function el(tag, text, cls) { const d = document.createElement(tag); if (text != null) d.textContent = text; if (cls) d.className = cls; return d; }

function select(n, center = true, instant = false) {
  pinned = n;
  if (n && n !== MAIN && follow) setFollow(false);
  if (n && catFocus) { catFocus = null; markLegend(); }
  const box = document.getElementById('info');
  document.body.classList.toggle('sel', !!n);
  if (!n) { box.style.display = 'none'; frame(); return; }
  box.innerHTML = '';
  const x = el('button', '×', 'x'); x.title = 'Close (Esc)'; x.onclick = () => select(null); box.appendChild(x);
  box.appendChild(el('h2', label(n.id)));
  const b = el('span', CAT[n.cat].name, 'badge'); b.style.background = `rgb(${CAT[n.cat].rgb})`; box.appendChild(b);
  if (n.kind !== 'entity' && n !== MAIN) box.appendChild(el('div', n.id, 'path'));
  if (n.desc) box.appendChild(el('div', n.desc, 'desc'));
  if (n.kind !== 'entity' && n !== MAIN) box.appendChild(el('div', 'area: ' + n.repo + (n.type ? ' · type: ' + n.type : '')));
  const tl = taskLinks.get(n.id) || [];  // the board tasks behind the pips: progress, click to open the task
  if (tl.length) box.appendChild(el('div', `board tasks (${tl.length})`, 'sec'));
  for (const [sec, it] of tl) {
    const p = prio(it), btn = el('button', (p.done >= 0 ? pips(p.done) + '  ' : '') + `${sec}: ${clean(p.text)}`, 'nb task');
    btn.style.borderLeftColor = `rgb(${SEC[sec]?.[1] || CAT[n.cat].rgb})`; btn.title = 'Open the task';
    btn.onclick = () => openTask(sec, it);
    box.appendChild(btn);
    if (p.done >= 0) box.appendChild(progBar(p.done));
  }
  const nb = neighbours(n), groups = {};
  for (const [m, e] of nb) {
    const how = n === MAIN ? 'working on (latest first)' : e.a === n ? e.k : e.k === 'links' ? 'linked from' : 'mentioned in';
    (groups[how] = groups[how] || []).push(m);
  }
  box.appendChild(el('div', `${nb.size} connections`, 'sec'));
  for (const [how, list] of Object.entries(groups)) {
    box.appendChild(el('div', how, 'sec'));
    list.sort((a, b) => label(a.id).localeCompare(label(b.id))).forEach(m => {
      const btn = el('button', label(m.id), 'nb');
      btn.style.borderLeftColor = `rgb(${CAT[m.cat].rgb})`;
      btn.onclick = () => select(m);
      box.appendChild(btn);
    });
  }
  if (n !== MAIN) box.appendChild(el('div', n.cat === 'agent' ? 'call this agent' : n.cat === 'skill' ? 'use this skill' : 'open from a terminal', 'sec'));
  if (n !== MAIN) box.appendChild(el('code', n.cat === 'agent' ? `Agent: ${label(n.id)}` : n.cat === 'skill' ? `/${label(n.id)}` :
    n.kind === 'entity' ? `python tools/vault.py entity ${n.id}` : `python tools/vault.py note ${label(n.id)}`));
  if (n.cat === 'agent' || n.cat === 'skill') {  // run it in a new Claude session (server: POST /run)
    const ask = el('textarea', null, 'runin'), go = el('button', '▶ Run in Claude', 'run'), msg = el('div', null, 'runmsg');
    ask.rows = 2; ask.maxLength = 2000; ask.placeholder = 'What should it do? (optional)';
    ask.value = runDraft[n.id] || ''; ask.oninput = () => runDraft[n.id] = ask.value;  // survives a panel rebuild
    go.onclick = async () => {
      if (!okLaunch()) return;
      msg.textContent = 'Opening Claude…';
      try {
        const r = await fetch('run', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Vault-Token': TOKEN },
          body: JSON.stringify({ id: n.id, input: ask.value.trim() }) });
        if (r.status === 403) { msg.textContent = 'Graph server restarted. Reloading the page…'; return setTimeout(() => location.reload(), 1200); }
        msg.textContent = r.ok ? `Opening Claude: ${(await r.json()).note}.` : 'Failed: HTTP ' + r.status;
        if (r.ok) delete runDraft[n.id];
      } catch { msg.textContent = 'Graph server is not running. Run: python tools/vault.py ui'; }
    };
    box.append(ask, go, msg);
  }
  box.style.display = 'block';
  if (center) {  // bring the selected star into the clear (tinted) space left of the panel
    const ins = insets();
    const k = Math.max(view.k, 1.2);
    animateTo({ k, x: -n.p.x * k + (ins.l - ins.r) / 2, y: -n.p.y * k + (ins.t - ins.b) / 2 }, instant);
    touched = true;
  }
  frame();
}

function nearest(mx, my) {
  let best = null, bd = 14;
  for (const k of markers) if (Math.hypot(k.x - mx, k.y - my) < 16) return k.n;  // edge marker -> its star
  { const [x, y] = S(MAIN.d), d = Math.hypot(x - mx, y - my); if (nodes.length && d < radius(MAIN) + 8) return MAIN; }
  for (const n of nodes) { const [x, y] = S(n.d), d = Math.hypot(x - mx, y - my); if (d < bd) { bd = d; best = n; } }
  return best;
}
function zoomAt(f, mx = W / 2, my = H / 2) {
  cam = null; followAt = null;  // still following after a zoom, from the new spot
  const ox = mx - W / 2, oy = my - H / 2;
  view.x = ox - (ox - view.x) * f; view.y = oy - (oy - view.y) * f; view.k *= f;
  touched = true; frame();
}

const pts = new Map(); let drag = null, pinch = null;
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  cam = null;
  if (pts.size === 1) drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false };
  if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); drag = null; }
  cv.style.cursor = 'grabbing';
});
cv.addEventListener('pointermove', e => {
  if (pts.has(e.pointerId)) pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pts.size === 2) {
    const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    zoomAt(d / pinch, (a.x + b.x) / 2, (a.y + b.y) / 2); pinch = d; return;
  }
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) { drag.moved = true; touched = true; if (follow) setFollow(false); }
    view.x = drag.vx + dx; view.y = drag.vy + dy; frame(); return;
  }
  const n = nearest(e.clientX, e.clientY);
  if (n !== hover) { hover = n; cv.style.cursor = n ? 'pointer' : 'grab'; frame(); }
});
const up = e => {
  if (drag && !drag.moved) { const n = nearest(e.clientX, e.clientY); if (!n) showCat(null); select(n); }  // empty space clears
  pts.delete(e.pointerId); if (pts.size < 2) pinch = null; drag = null; cv.style.cursor = 'grab';

  catch { tmEl('tmmsg').textContent = 'Graph server is not running. Run: python tools/vault.py ui'; }
};
addEventListener('keydown', e => { if (e.key === 'Escape' && tmTask) { e.stopImmediatePropagation(); closeTask(); } }, true);

// #task=3 opens the 3rd task on the board (top to bottom), once; handy for links and screenshots
let taskHashDone = false;
function openTaskFromHash() {
  const m = !taskHashDone && location.hash.match(/task=(\d+)/);
  if (!m) return;
  taskHashDone = true;
  const li = document.querySelectorAll('#board li')[+m[1] - 1];
  if (li) li.click();
}
let flashTimer, htmlVer = null;
async function poll() {
  try {
    const st = await (await fetch('status?' + Date.now(), { cache: 'no-store' })).json();
    if (htmlVer !== null && st.html !== htmlVer) {  // page code changed: reload quietly, same view
      try { sessionStorage.setItem('vaultGraph', JSON.stringify({ view, pos, touched, pinned: pinned && pinned.id })); } catch (e) {}
      return location.reload();
    }
    htmlVer = st.html;
    active = st.activity || {};
    renderLog(st.log || [], st.now || Date.now() / 1000);
    SESS = st.sessions || {};
    renderUsage(st.usage);
    if (st.board_file) BOARD_FILE = st.board_file;
    renderBoard(st.board);
    const names = Object.entries(active).filter(([, v]) => v.kind === 'agent').map(([k]) => k);
    document.getElementById('running').textContent = names.length ? 'running: ' + names.join(', ') : '';
    const g = await (await fetch('graph.json?' + Date.now(), { cache: 'no-store' })).json();
    document.getElementById('stale').style.display = 'none';
    document.getElementById('stamp').textContent = 'graph built ' + fmt(new Date(g.built)) + ' · refreshed ' + fmt(new Date());
    if (g.built !== built) {
      const first = built === null;
      built = g.built;
      load(g);
      const m = first && location.hash.match(/cat=(\w+)/); if (m && CAT[m[1]]) showCat(m[1]);  // e.g. #cat=agent
      if (first) openTaskFromHash();  // e.g. #task=1, after the stars exist
      if (!first) {
        const f = document.getElementById('flash'); f.style.display = 'inline';
        clearTimeout(flashTimer); flashTimer = setTimeout(() => f.style.display = 'none', 4000);
      }
    }
  } catch (err) {
    document.getElementById('stale').style.display = 'inline';
  }
}
resize();
if (!still && VIEW !== 'tasks') raf = requestAnimationFrame(loop);  // the tasks page has no canvas to draw
poll();
setInterval(poll, 2000);
</script>

name: Bug report
description: Something does not work as described in the README.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste real notes, tokens, file paths with your name, or logs with private data. Use the example vault to reproduce if you can.
        Security problems go to the Security tab (Report a vulnerability), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. python example-vault/demo.py
        2. Click ...
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command or part of the UI
      placeholder: "e.g. vault.py sync, the task board, Do it in Claude"
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "python --version"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or error
      description: Terminal output, or graph/server-error.log for server errors. Remove anything private.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed personal data and secrets from this report.
          required: true

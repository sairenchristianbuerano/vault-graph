name: Feature request
description: Suggest an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        vault-graph stays small: standard library only, one HTML file, no external requests. Ideas that fit that shape are easiest to accept.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could it work? A config key, a command, a change to the UI?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: fit
    attributes:
      label: Fit
      options:
        - label: This works without new dependencies.
        - label: I would be willing to open a pull request.
